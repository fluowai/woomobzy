<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InoveBrokers — Em breve</title>
    <meta
      name="description"
      content="Em breve um sistema será instalado aqui."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310131f'/%3E%3Cpath d='M32 14 12 30h6v20h10V38h8v12h10V30h6z' fill='%2360a5fa'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg-0: #0b0e1a;
        --bg-1: #10142a;
        --accent: #60a5fa;
        --accent-2: #a78bfa;
        --text: #e6e9f5;
        --text-muted: #9aa3c0;
        --border: rgba(148, 163, 184, 0.18);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          Roboto,
          Arial,
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            1000px 520px at 85% -10%,
            rgba(96, 165, 250, 0.18),
            transparent 60%
          ),
          radial-gradient(
            900px 520px at 5% 110%,
            rgba(167, 139, 250, 0.16),
            transparent 60%
          ),
          linear-gradient(160deg, var(--bg-0), var(--bg-1));
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        max-width: 560px;
        width: 100%;
        text-align: center;
        padding: 48px 32px 40px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: rgba(16, 20, 42, 0.55);
        backdrop-filter: blur(14px);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      }

      .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 28px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 12px 30px rgba(96, 165, 250, 0.35);
      }

      .logo svg {
        width: 34px;
        height: 34px;
      }

      h1 {
        font-size: clamp(30px, 6vw, 44px);
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(120deg, var(--text), #b9c2e2);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .dot {
        color: var(--accent);
        -webkit-text-fill-color: var(--accent);
      }

      p.subtitle {
        margin-top: 14px;
        font-size: 18px;
        line-height: 1.65;
        color: var(--text-muted);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 28px;
        padding: 8px 18px;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent);
        background: rgba(96, 165, 250, 0.08);
      }

      .badge .pulse {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.8s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.55);
        }
        50% {
          box-shadow: 0 0 0 8px rgba(96, 165, 250, 0);
        }
      }

      footer {
        margin-top: 36px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
        font-size: 13px;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M32 8 10 26h6v22h12V38h8v10h12V26h6L32 8z" fill="#ffffff" />
        </svg>
      </div>

      <h1>Em breve<span class="dot">.</span></h1>

      <p class="subtitle">
        Um sistema será instalado aqui.<br />
        Estamos preparando tudo com muito cuidado para atender você.
      </p>

      <div class="badge">
        <span class="pulse" aria-hidden="true"></span>
        InoveBrokers
      </div>

      <footer>© <span id="year"></span> InoveBrokers — Em construção</footer>
    </main>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
