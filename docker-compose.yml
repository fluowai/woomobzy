  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq-server
    environment:
      RABBITMQ_ERLANG_COOKIE: "IMOBZYRABBITMQSECRETCOOKIESWARM"
      RABBITMQ_DEFAULT_USER: "imobzy"
