version: '3.8'

services:
  frontend:
    image: ghcr.io/fluowai/woomobzy-frontend:latest
    environment:
      VITE_API_URL: 'same-origin'
      VITE_WHATSAPP_API_URL: '/api/whatsapp'
      VITE_WHATSAPP_WS_URL: '/api/whatsapp/ws'
      VITE_SUPABASE_URL: '${VITE_SUPABASE_URL}'
      VITE_SUPABASE_ANON_KEY: '${VITE_SUPABASE_ANON_KEY}'
      VITE_PANEL_URL: 'https://imob.wootech.com.br'
      VITE_PUBLIC_APP_URL: 'https://imob.wootech.com.br'
      VITE_PLATFORM_IP: '207.58.153.219'
    networks:
      - wootech1
      - imobfluow_internal
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=wootech1'
      - 'traefik.http.routers.wootech_imob_frontend.rule=Host(`imob.wootech.com.br`) || Host(`imobfluow.consultio.com.br`)'
      - 'traefik.http.routers.wootech_imob_frontend.entrypoints=websecure'
      - 'traefik.http.routers.wootech_imob_frontend.tls.certresolver=letsencryptresolver'
      - 'traefik.http.routers.wootech_imob_frontend.priority=1'
      - 'traefik.http.routers.wootech_imob_frontend.service=wootech_imob_frontend'
      - 'traefik.http.services.wootech_imob_frontend.loadbalancer.server.port=80'

  coming-soon:
    image: ghcr.io/fluowai/inovebrokers-coming-soon:latest
    restart: unless-stopped
    networks:
      - wootech1

  api:
    image: ghcr.io/fluowai/woomobzy-api:latest
    environment:
      NODE_ENV: production
      PORT: 3002
      WHATSAPP_PROVIDER: 'whatsmeow'
      WHATSAPP_WEBHOOK_URL: 'http://api:3002'
      ALLOWED_ORIGINS: 'https://imob.wootech.com.br,https://imobfluow.consultio.com.br'
      CORS_ORIGINS: 'https://imob.wootech.com.br,https://imobfluow.consultio.com.br'
      VITE_SUPABASE_URL: '${VITE_SUPABASE_URL}'
      VITE_SUPABASE_ANON_KEY: '${VITE_SUPABASE_ANON_KEY}'
      SUPABASE_SERVICE_ROLE_KEY: '${SUPABASE_SERVICE_ROLE_KEY}'
      SUPABASE_JWT_SECRET: '${SUPABASE_JWT_SECRET}'
      DATABASE_URL: '${DATABASE_URL}'
      SUPABASE_DB_URL: '${SUPABASE_DB_URL}'
      PGSSLMODE: require
      WHATSAPP_API_URL: 'http://whatsapp-service:3100'
      WHATSMEOW_URL: 'http://whatsapp-service:3100'
      NODE_URL: 'http://api:3002'
      AGRO_INTEL_URL: 'http://agro-intelligence:8000'
      INSTAGRAM_SERVICE_URL: 'http://instagram-service:3200'
      OPENAI_API_KEY: '${OPENAI_API_KEY}'
      GEMINI_API_KEY: '${GEMINI_API_KEY}'
      GROQ_API_KEY: '${GROQ_API_KEY}'
      WHATSAPP_SERVICE_TOKEN: '${WHATSAPP_SERVICE_TOKEN}'
      WHATSAPP_INTERNAL_TOKEN: '${WHATSAPP_INTERNAL_TOKEN}'
      WHATSAPP_WS_JWT_SECRET: '${WHATSAPP_WS_JWT_SECRET}'
      WHATSAPP_AI_AUTOMATION: 'true'
      RABBITMQ_URL: '${RABBITMQ_URL}'
      MEDIA_STORAGE_PROVIDER: 'minio'
      ALLOW_SUPABASE_STORAGE_FALLBACK: 'true'
      MINIO_ENDPOINT: 'http://minio:9000'
      MINIO_PUBLIC_URL: '${MINIO_PUBLIC_URL}'
      MINIO_ACCESS_KEY: '${MINIO_ACCESS_KEY}'
      MINIO_SECRET_KEY: '${MINIO_SECRET_KEY}'
      MINIO_REGION: '${MINIO_REGION}'
      MINIO_WHATSAPP_BUCKET: '${MINIO_WHATSAPP_BUCKET}'
      TRAEFIK_DYNAMIC_DIR: '/app/traefik/dynamic'
      TRAEFIK_FRONTEND_SERVICE: 'wootech_imob_frontend@docker'
      TRAEFIK_API_SERVICE: 'wootech_imob_api@docker'
    volumes:
      - imobzy_traefik_dynamic:/app/traefik/dynamic
    networks:
      - wootech1
      - imobfluow_internal
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=wootech1'
      - 'traefik.http.routers.wootech_imob_whatsapp_ws.rule=(Host(`imob.wootech.com.br`) || Host(`imobfluow.consultio.com.br`)) && PathPrefix(`/api/whatsapp/ws`)'
      - 'traefik.http.routers.wootech_imob_whatsapp_ws.entrypoints=websecure'
      - 'traefik.http.routers.wootech_imob_whatsapp_ws.tls.certresolver=letsencryptresolver'
      - 'traefik.http.routers.wootech_imob_whatsapp_ws.priority=20'
      - 'traefik.http.routers.wootech_imob_whatsapp_ws.service=wootech_imob_api'
      - 'traefik.http.routers.wootech_imob_api.rule=(Host(`imob.wootech.com.br`) || Host(`imobfluow.consultio.com.br`)) && PathPrefix(`/api`)'
      - 'traefik.http.routers.wootech_imob_api.entrypoints=websecure'
      - 'traefik.http.routers.wootech_imob_api.tls.certresolver=letsencryptresolver'
      - 'traefik.http.routers.wootech_imob_api.priority=10'
      - 'traefik.http.routers.wootech_imob_api.service=wootech_imob_api'
      - 'traefik.http.services.wootech_imob_api.loadbalancer.server.port=3002'

  whatsapp-service:
    image: ghcr.io/fluowai/woomobzy-whatsapp:latest
    environment:
      NODE_ENV: production
      PORT: 3100
      ALLOWED_ORIGINS: 'https://imob.wootech.com.br,https://imobfluow.consultio.com.br'
      CORS_ORIGINS: 'https://imob.wootech.com.br,https://imobfluow.consultio.com.br'
      SUPABASE_URL: '${VITE_SUPABASE_URL}'
      SUPABASE_SERVICE_ROLE_KEY: '${SUPABASE_SERVICE_ROLE_KEY}'
      SUPABASE_JWT_SECRET: '${SUPABASE_JWT_SECRET}'
      SUPABASE_DB_URL: '${SUPABASE_DB_URL}'
      PGSSLMODE: require
      NODE_URL: 'http://api:3002'
      OPENAI_API_KEY: '${OPENAI_API_KEY}'
      GEMINI_API_KEY: '${GEMINI_API_KEY}'
      GROQ_API_KEY: '${GROQ_API_KEY}'
      WHATSAPP_SERVICE_TOKEN: '${WHATSAPP_SERVICE_TOKEN}'
      WHATSAPP_INTERNAL_TOKEN: '${WHATSAPP_INTERNAL_TOKEN}'
      WHATSAPP_WS_JWT_SECRET: '${WHATSAPP_WS_JWT_SECRET}'
      WHATSAPP_AI_AUTOMATION: 'true'
      MEDIA_STORAGE_PROVIDER: 'minio'
      ALLOW_SUPABASE_STORAGE_FALLBACK: 'true'
      MINIO_ENDPOINT: 'http://minio:9000'
      MINIO_PUBLIC_URL: '${MINIO_PUBLIC_URL}'
      MINIO_ACCESS_KEY: '${MINIO_ACCESS_KEY}'
      MINIO_SECRET_KEY: '${MINIO_SECRET_KEY}'
      MINIO_REGION: '${MINIO_REGION}'
      MINIO_WHATSAPP_BUCKET: '${MINIO_WHATSAPP_BUCKET}'
    volumes:
      - whatsapp_sessions:/app/.sessions
    networks:
      - imobfluow_internal

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD}'
    volumes:
      - minio_data:/data
    networks:
      - wootech1
      - imobfluow_internal
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=wootech1'
      - 'traefik.http.routers.minio_nb.rule=Host(`nb.consultio.com.br`)'
      - 'traefik.http.routers.minio_nb.entrypoints=websecure'
      - 'traefik.http.routers.minio_nb.tls.certresolver=letsencryptresolver'
      - 'traefik.http.routers.minio_nb.service=minio_nb'
      - 'traefik.http.services.minio_nb.loadbalancer.server.port=9000'

  # Provisiona o MinIO novo (do zero): buckets + policy imobzy-rw + usuário do app.
  # Idempotente — roda a cada subida da stack e não quebra se já existir.
  minio-init:
    image: minio/mc:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        for i in $$(seq 1 60); do
          if mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; then break; fi
          sleep 2
        done
        mc mb --ignore-existing \
          local/imobzycrm \
          local/imobzywhatsapp \
          local/imobzy-media \
          local/imobzy-documents \
          local/imobzy-exports \
          local/imobzy-backups \
          local/imobzy-contracts
        printf '%s\n' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::imobzy*","arn:aws:s3:::imobzy*/*"]}]}' > /tmp/imobzy-rw.json
        mc admin policy create local imobzy-rw /tmp/imobzy-rw.json >/dev/null 2>&1 || true
        mc admin user add local "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY" >/dev/null 2>&1 || true
        mc admin policy attach local imobzy-rw --user "$$MINIO_APP_ACCESS_KEY" >/dev/null 2>&1 || true
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD}'
      MINIO_APP_ACCESS_KEY: '${MINIO_ACCESS_KEY}'
      MINIO_APP_SECRET_KEY: '${MINIO_SECRET_KEY}'
    networks:
      - imobfluow_internal
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq-server
    environment:
      RABBITMQ_ERLANG_COOKIE: '${RABBITMQ_ERLANG_COOKIE:?cookie de 32+ caracteres obrigatorio}'
      RABBITMQ_DEFAULT_USER: 'imobzy'
      RABBITMQ_DEFAULT_PASS: '${RABBITMQ_DEFAULT_PASS}'
      RABBITMQ_NODENAME: 'rabbit@rabbitmq-server'
    volumes:
      - rabbitmq_data_v4:/var/lib/rabbitmq/mnesia
    networks:
      - imobfluow_internal
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  agro-intelligence:
    image: ghcr.io/fluowai/woomobzy-agro:latest
    networks:
      - imobfluow_internal

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - imobfluow_internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  instagram-service:
    image: ghcr.io/fluowai/woomobzy-instagram-service:latest
    environment:
      NODE_ENV: production
      PORT: '3200'
      REDIS_URL: 'redis://redis:6379'
      INSTAGRAM_WORKER_URL: 'http://instagram-worker:8000'
      INSTAGRAM_INTERNAL_TOKEN: '${INSTAGRAM_INTERNAL_TOKEN}'
      ALLOWED_ORIGINS: 'https://imob.wootech.com.br,https://imobfluow.consultio.com.br'
      SUPABASE_URL: '${VITE_SUPABASE_URL}'
      SUPABASE_SERVICE_ROLE_KEY: '${SUPABASE_SERVICE_ROLE_KEY}'
      SUPABASE_JWT_SECRET: '${SUPABASE_JWT_SECRET}'
    networks:
      - imobfluow_internal
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  instagram-worker:
    image: ghcr.io/fluowai/woomobzy-instagram-worker:latest
    environment:
      SUPABASE_URL: '${VITE_SUPABASE_URL}'
      SUPABASE_SERVICE_ROLE_KEY: '${SUPABASE_SERVICE_ROLE_KEY}'
      REDIS_URL: 'redis://redis:6379'
      INSTAGRAM_INTERNAL_TOKEN: '${INSTAGRAM_INTERNAL_TOKEN}'
      INSTAGRAM_ENCRYPTION_SECRET: '${INSTAGRAM_ENCRYPTION_SECRET}'
      NODE_SERVICE_URL: 'http://instagram-service:3200'
    volumes:
      - instagram_devices:/data/devices
      - instagram_sessions:/data/sessions
    networks:
      - imobfluow_internal
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  whatsapp_sessions:
  rabbitmq_data_v4:
  imobzy_traefik_dynamic:
    external: true
  redis_data:
  instagram_devices:
  instagram_sessions:
  minio_data:

networks:
  wootech1:
    external: true
  imobfluow_internal:
    driver: bridge
