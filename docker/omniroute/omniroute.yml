port: 20128
providers:
  - name: "gemini-free"
    type: "gemini"
    api_key: "${GEMINI_API_KEY}" # Uses existing env var from IMOBZY
  - name: "pollinations"
    type: "openai"
    base_url: "https://text.pollinations.ai/openai"
    api_key: "dummy" # No auth required
  - name: "openrouter-free"
    type: "openai"
    base_url: "https://openrouter.ai/api/v1"
    api_key: "${OPENROUTER_API_KEY}" # If they have one, optional
combos:
  - id: "auto/wootech"
    strategy: "priority"
    targets:
      - "pollinations"
      - "gemini-free"
      - "openrouter-free"
