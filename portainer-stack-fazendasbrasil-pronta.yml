version: '3.8'

services:
  frontend:
    image: ghcr.io/fluowai/woomobzy-frontend:latest
    environment:
      VITE_API_URL: 'same-origin'
      VITE_WHATSAPP_API_URL: '/api/whatsapp'
      VITE_WHATSAPP_WS_URL: '/api/whatsapp/ws'
      VITE_SUPABASE_URL: '${VITE_SUPABASE_URL}'
      VITE_SUPABASE_ANON_KEY: '${VITE_SUPABASE_ANON_KEY}'
      VITE_PANEL_URL: 'https://imobfluow.consultio.com.br'
      VITE_PUBLIC_APP_URL: 'https://imobfluow.consultio.com.br'
      VITE_PLATFORM_IP: '207.58.153.219'
    networks:
      - woopanel1
      - imobfluow_internal
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=woopanel1'
      - 'traefik.http.routers.imobfluow_frontend.rule=Host(`imobfluow.consultio.com.br`) || Host(`okaimoveis.com.br`) || Host(`www.okaimoveis.com.br`) || Host(`fazendasbrasil.com`) || Host(`www.fazendasbrasil.com`) || Host(`fazendasbrasil.com.br`) || Host(`www.fazendasbrasil.com.br`)'
      - 'traefik.http.routers.imobfluow_frontend.entrypoints=websecure'
      - 'traefik.http.routers.imobfluow_frontend.tls.certresolver=letsencryptresolver'
      - 'traefik.http.routers.imobfluow_frontend.priority=1'
      - 'traefik.http.routers.imobfluow_frontend.service=imobfluow_frontend'
      - 'traefik.http.services.imobfluow_frontend.loadbalancer.server.port=80'
    deploy:
      restart_policy:
        condition: any
      labels:
        - 'traefik.enable=true'
        - 'traefik.docker.network=woopanel1'
        - 'traefik.http.routers.imobfluow_frontend.rule=Host(`imobfluow.consultio.com.br`) || Host(`okaimoveis.com.br`) || Host(`www.okaimoveis.com.br`) || Host(`fazendasbrasil.com`) || Host(`www.fazendasbrasil.com`) || Host(`fazendasbrasil.com.br`) || Host(`www.fazendasbrasil.com.br`)'
        - 'traefik.http.routers.imobfluow_frontend.entrypoints=websecure'
        - 'traefik.http.routers.imobfluow_frontend.tls.certresolver=letsencryptresolver'
        - 'traefik.http.routers.imobfluow_frontend.priority=1'
        - 'traefik.http.routers.imobfluow_frontend.service=imobfluow_frontend'
        - 'traefik.http.services.imobfluow_frontend.loadbalancer.server.port=80'

  api:
    image: ghcr.io/fluowai/woomobzy-api:latest
    environment:
      NODE_ENV: production
      PORT: 3002
      ALLOWED_ORIGINS: 'https://imobfluow.consultio.com.br,https://okaimoveis.com.br,https://www.okaimoveis.com.br,https://fazendasbrasil.com,https://www.fazendasbrasil.com,https://fazendasbrasil.com.br,https://www.fazendasbrasil.com.br'
      CORS_ORIGINS: 'https://imobfluow.consultio.com.br,https://okaimoveis.com.br,https://www.okaimoveis.com.br,https://fazendasbrasil.com,https://www.fazendasbrasil.com,https://fazendasbrasil.com.br,https://www.fazendasbrasil.com.br'
      VITE_SUPABASE_URL: '${VITE_SUPABASE_URL}'
      VITE_SUPABASE_ANON_KEY: '${VITE_SUPABASE_ANON_KEY}'
      SUPABASE_SERVICE_ROLE_KEY: '${SUPABASE_SERVICE_ROLE_KEY}'
      SUPABASE_JWT_SECRET: '${SUPABASE_JWT_SECRET}'
      DATABASE_URL: '${DATABASE_URL}'
      SUPABASE_DB_URL: '${SUPABASE_DB_URL}'
      PGSSLMODE: require
      WHATSAPP_API_URL: 'http://whatsapp-service:3100'
      WHATSMEOW_URL: 'http://whatsapp-service:3100'
      NODE_URL: 'http://api:3002'
      AGRO_INTEL_URL: 'http://agro-intelligence:8000'
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: 'sua-api-key-do-gemini'
      GROQ_API_KEY: 'sua-api-key-do-groq'
      WHATSAPP_SERVICE_TOKEN: '${WHATSAPP_SERVICE_TOKEN}'
      WHATSAPP_INTERNAL_TOKEN: '${WHATSAPP_INTERNAL_TOKEN}'
      WHATSAPP_WS_JWT_SECRET: '${WHATSAPP_WS_JWT_SECRET}'
      WHATSAPP_AI_AUTOMATION: 'true'
      RABBITMQ_URL: '${RABBITMQ_URL}'
      MEDIA_STORAGE_PROVIDER: 'minio'
      MINIO_ENDPOINT: 'https://mypanel.wootech.com.br'
      MINIO_PUBLIC_URL: 'https://mypanel.wootech.com.br'
      MINIO_ACCESS_KEY: 'U7lWsqJfDo0NaAsxnbQX'
      MINIO_SECRET_KEY: '8xpjlsOGgcyQWprFHiK0XxKClU8RgI0F0OumYza2'
      MINIO_REGION: 'us-east-1'
      MINIO_WHATSAPP_BUCKET: 'imobztwootech'
      TRAEFIK_DYNAMIC_DIR: '/app/traefik/dynamic'
    volumes:
      - imobzy_traefik_dynamic:/app/traefik/dynamic
    networks:
      - woopanel1
      - imobfluow_internal
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=woopanel1'
      - 'traefik.http.routers.imobfluow_whatsapp_ws.rule=(Host(`imobfluow.consultio.com.br`) || Host(`okaimoveis.com.br`) || Host(`www.okaimoveis.com.br`) || Host(`fazendasbrasil.com`) || Host(`www.fazendasbrasil.com`) || Host(`fazendasbrasil.com.br`) || Host(`www.fazendasbrasil.com.br`)) && PathPrefix(`/api/whatsapp/ws`)'
      - 'traefik.http.routers.imobfluow_whatsapp_ws.entrypoints=websecure'
      - 'traefik.http.routers.imobfluow_whatsapp_ws.tls.certresolver=letsencryptresolver'
      - 'traefik.http.routers.imobfluow_whatsapp_ws.priority=20'
      - 'traefik.http.routers.imobfluow_whatsapp_ws.service=imobfluow_api'
      - 'traefik.http.routers.imobfluow_api.rule=(Host(`imobfluow.consultio.com.br`) || Host(`okaimoveis.com.br`) || Host(`www.okaimoveis.com.br`) || Host(`fazendasbrasil.com`) || Host(`www.fazendasbrasil.com`) || Host(`fazendasbrasil.com.br`) || Host(`www.fazendasbrasil.com.br`)) && PathPrefix(`/api`)'
      - 'traefik.http.routers.imobfluow_api.entrypoints=websecure'
      - 'traefik.http.routers.imobfluow_api.tls.certresolver=letsencryptresolver'
      - 'traefik.http.routers.imobfluow_api.priority=10'
      - 'traefik.http.routers.imobfluow_api.service=imobfluow_api'
      - 'traefik.http.services.imobfluow_api.loadbalancer.server.port=3002'
    deploy:
      restart_policy:
        condition: any
      labels:
        - 'traefik.enable=true'
        - 'traefik.docker.network=woopanel1'
        - 'traefik.http.routers.imobfluow_whatsapp_ws.rule=(Host(`imobfluow.consultio.com.br`) || Host(`okaimoveis.com.br`) || Host(`www.okaimoveis.com.br`) || Host(`fazendasbrasil.com`) || Host(`www.fazendasbrasil.com`) || Host(`fazendasbrasil.com.br`) || Host(`www.fazendasbrasil.com.br`)) && PathPrefix(`/api/whatsapp/ws`)'
        - 'traefik.http.routers.imobfluow_whatsapp_ws.entrypoints=websecure'
        - 'traefik.http.routers.imobfluow_whatsapp_ws.tls.certresolver=letsencryptresolver'
        - 'traefik.http.routers.imobfluow_whatsapp_ws.priority=20'
        - 'traefik.http.routers.imobfluow_whatsapp_ws.service=imobfluow_api'
        - 'traefik.http.routers.imobfluow_api.rule=(Host(`imobfluow.consultio.com.br`) || Host(`okaimoveis.com.br`) || Host(`www.okaimoveis.com.br`) || Host(`fazendasbrasil.com`) || Host(`www.fazendasbrasil.com`) || Host(`fazendasbrasil.com.br`) || Host(`www.fazendasbrasil.com.br`)) && PathPrefix(`/api`)'
        - 'traefik.http.routers.imobfluow_api.entrypoints=websecure'
        - 'traefik.http.routers.imobfluow_api.tls.certresolver=letsencryptresolver'
        - 'traefik.http.routers.imobfluow_api.priority=10'
        - 'traefik.http.routers.imobfluow_api.service=imobfluow_api'
        - 'traefik.http.services.imobfluow_api.loadbalancer.server.port=3002'

  whatsapp-service:
    image: ghcr.io/fluowai/woomobzy-whatsapp:latest
    environment:
      NODE_ENV: production
      PORT: 3100
      ALLOWED_ORIGINS: 'https://imobfluow.consultio.com.br,https://okaimoveis.com.br,https://www.okaimoveis.com.br,https://fazendasbrasil.com,https://www.fazendasbrasil.com,https://fazendasbrasil.com.br,https://www.fazendasbrasil.com.br'
      CORS_ORIGINS: 'https://imobfluow.consultio.com.br,https://okaimoveis.com.br,https://www.okaimoveis.com.br,https://fazendasbrasil.com,https://www.fazendasbrasil.com,https://fazendasbrasil.com.br,https://www.fazendasbrasil.com.br'
      VITE_SUPABASE_URL: '${VITE_SUPABASE_URL}'
      VITE_SUPABASE_ANON_KEY: '${VITE_SUPABASE_ANON_KEY}'
      SUPABASE_SERVICE_ROLE_KEY: '${SUPABASE_SERVICE_ROLE_KEY}'
      SUPABASE_JWT_SECRET: '${SUPABASE_JWT_SECRET}'
      DATABASE_URL: '${DATABASE_URL}'
      SUPABASE_DB_URL: '${SUPABASE_DB_URL}'
      PGSSLMODE: require
      NODE_URL: 'http://api:3002'
      WHATSMEOW_URL: 'http://whatsapp-service:3100'
      WHATSAPP_API_URL: 'http://whatsapp-service:3100'
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: 'sua-api-key-do-gemini'
      GROQ_API_KEY: 'sua-api-key-do-groq'
      WHATSAPP_SERVICE_TOKEN: '${WHATSAPP_SERVICE_TOKEN}'
      WHATSAPP_INTERNAL_TOKEN: '${WHATSAPP_INTERNAL_TOKEN}'
      WHATSAPP_WS_JWT_SECRET: '${WHATSAPP_WS_JWT_SECRET}'
      WHATSAPP_AI_AUTOMATION: 'true'
      RABBITMQ_URL: '${RABBITMQ_URL}'
      MEDIA_STORAGE_PROVIDER: 'minio'
      MINIO_ENDPOINT: 'https://mypanel.wootech.com.br'
      MINIO_PUBLIC_URL: 'https://mypanel.wootech.com.br'
      MINIO_ACCESS_KEY: 'U7lWsqJfDo0NaAsxnbQX'
      MINIO_SECRET_KEY: '8xpjlsOGgcyQWprFHiK0XxKClU8RgI0F0OumYza2'
      MINIO_REGION: 'us-east-1'
      MINIO_WHATSAPP_BUCKET: 'imobztwootech'
    volumes:
      - whatsapp_sessions:/app/.sessions
    networks:
      - imobfluow_internal
    deploy:
      restart_policy:
        condition: any

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: 'imobzy'
      RABBITMQ_DEFAULT_PASS: '${RABBITMQ_DEFAULT_PASS}'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - imobfluow_internal
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      restart_policy:
        condition: any

  agro-intelligence:
    image: ghcr.io/fluowai/woomobzy-agro:latest
    networks:
      - imobfluow_internal
    deploy:
      restart_policy:
        condition: any

volumes:
  whatsapp_sessions:
  rabbitmq_data:
  imobzy_traefik_dynamic:
    external: true

networks:
  woopanel1:
    external: true
  imobfluow_internal:
    driver: overlay
