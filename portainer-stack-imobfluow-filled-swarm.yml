  # MinIO novo (fresh start): endpoint interno http://minio:9000 evita TLS/rota externa.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "wootechadmin"
      MINIO_ROOT_PASSWORD: "Argo@4898800326099brsc"
    volumes:
      - minio_data:/data
    networks:
