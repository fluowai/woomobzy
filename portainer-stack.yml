version: '3.8'

services:
  frontend:
    image: ghcr.io/fluowai/woomobzy-frontend:latest
    environment:
      VITE_API_URL: 'same-origin'
      VITE_WHATSAPP_API_URL: '/api/whatsapp'
      VITE_WHATSAPP_WS_URL: '/api/whatsapp/ws'
      VITE_SUPABASE_URL: '${VITE_SUPABASE_URL}'
      VITE_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwZ2FmdHNqbXFtcGN6dnpzcmNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NjUyNDUsImV4cCI6MjEwMDU0MTI0NX0.3p4x2i_BtGwzp4ElNV-HqeeVlQcQS53SWai5nJ2NTL0'
      VITE_PANEL_URL: 'https://imob.wootech.com.br'
      VITE_PUBLIC_APP_URL: 'https://imob.wootech.com.br'
    networks:
      - woopanel1
      - imobfluow_internal
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=woopanel1'
      - 'traefik.http.routers.wootech_imob_frontend.rule=Host(`imob.wootech.com.br`) || Host(`imobfluow.consultio.com.br`) || Host(`okaimoveis.com.br`) || Host(`www.okaimoveis.com.br`)'
      - 'traefik.http.routers.wootech_imob_frontend.entrypoints=websecure'
      - 'traefik.http.routers.wootech_imob_frontend.tls.certresolver=letsencryptresolver'
      - 'traefik.http.routers.wootech_imob_frontend.priority=1'
      - 'traefik.http.routers.wootech_imob_frontend.service=wootech_imob_frontend'
      - 'traefik.http.routers.fazendasbrasil_frontend.rule=Host(`fazendasbrasil.com`) || Host(`www.fazendasbrasil.com`)'
      - 'traefik.http.routers.fazendasbrasil_frontend.entrypoints=websecure'
      - 'traefik.http.routers.fazendasbrasil_frontend.tls.certresolver=letsencryptresolver'
      - 'traefik.http.routers.fazendasbrasil_frontend.priority=2'
      - 'traefik.http.routers.fazendasbrasil_frontend.service=wootech_imob_frontend'
      - 'traefik.http.services.wootech_imob_frontend.loadbalancer.server.port=80'

  api:
    image: ghcr.io/fluowai/woomobzy-api:latest
    environment:
      NODE_ENV: production
      PORT: 3002
      PLATFORM_IP: "207.58.153.219"
      WHATSAPP_PROVIDER: 'whatsmeow'
      WHATSAPP_WEBHOOK_URL: 'http://api:3002'
      ALLOWED_ORIGINS: 'https://imob.wootech.com.br,https://imobfluow.consultio.com.br,https://okaimoveis.com.br,https://www.okaimoveis.com.br,https://fazendasbrasil.com,https://www.fazendasbrasil.com,https://fazendasbrasil.com.br,https://www.fazendasbrasil.com.br'
      CORS_ORIGINS: 'https://imob.wootech.com.br,https://imobfluow.consultio.com.br,https://okaimoveis.com.br,https://www.okaimoveis.com.br,https://fazendasbrasil.com,https://www.fazendasbrasil.com,https://fazendasbrasil.com.br,https://www.fazendasbrasil.com.br'
      VITE_SUPABASE_URL: '${VITE_SUPABASE_URL}'
      VITE_SUPABASE_ANON_KEY: '${VITE_SUPABASE_ANON_KEY}'
      SUPABASE_SERVICE_ROLE_KEY: '${SUPABASE_SERVICE_ROLE_KEY}'
      SUPABASE_JWT_SECRET: '${SUPABASE_JWT_SECRET}'
      DATABASE_URL: '${DATABASE_URL}'
      SUPABASE_DB_URL: '${SUPABASE_DB_URL}'
      PGSSLMODE: require
      WHATSAPP_API_URL: 'http://whatsapp-service:3100'
      WHATSMEOW_URL: 'http://whatsapp-service:3100'
      NODE_URL: 'http://api:3002'
      AGRO_INTEL_URL: 'http://agro-intelligence:8000'
      OPENAI_API_KEY: '${OPENAI_API_KEY}'
      GEMINI_API_KEY: '${GEMINI_API_KEY}'
      GROQ_API_KEY: '${GROQ_API_KEY}'
      WHATSAPP_SERVICE_TOKEN: '${WHATSAPP_SERVICE_TOKEN}'
      WHATSAPP_INTERNAL_TOKEN: '${WHATSAPP_INTERNAL_TOKEN}'
      WHATSAPP_WS_JWT_SECRET: '${WHATSAPP_WS_JWT_SECRET}'
      WHATSAPP_AI_AUTOMATION: 'true'
      RABBITMQ_URL: '${RABBITMQ_URL}'
      MEDIA_STORAGE_PROVIDER: 'minio'
      MINIO_ENDPOINT: '${MINIO_ENDPOINT}'
      MINIO_PUBLIC_URL: '${MINIO_PUBLIC_URL}'
      MINIO_ACCESS_KEY: '${MINIO_ACCESS_KEY}'
      MINIO_SECRET_KEY: '${MINIO_SECRET_KEY}'
      MINIO_REGION: '${MINIO_REGION}'
      MINIO_WHATSAPP_BUCKET: '${MINIO_WHATSAPP_BUCKET}'
      TRAEFIK_DYNAMIC_DIR: '/app/traefik/dynamic'
      TRAEFIK_FRONTEND_SERVICE: 'wootech_imob_frontend@docker'
      TRAEFIK_API_SERVICE: 'wootech_imob_api@docker'
    volumes:
      - imobzy_traefik_dynamic:/app/traefik/dynamic
    networks:
      - woopanel1
      - imobfluow_internal
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=woopanel1'
      - 'traefik.http.routers.wootech_imob_whatsapp_ws.rule=(Host(`imob.wootech.com.br`) || Host(`imobfluow.consultio.com.br`) || Host(`okaimoveis.com.br`) || Host(`www.okaimoveis.com.br`)) && PathPrefix(`/api/whatsapp/ws`)'
      - 'traefik.http.routers.wootech_imob_whatsapp_ws.entrypoints=websecure'
      - 'traefik.http.routers.wootech_imob_whatsapp_ws.tls.certresolver=letsencryptresolver'
      - 'traefik.http.routers.wootech_imob_whatsapp_ws.priority=20'
      - 'traefik.http.routers.wootech_imob_whatsapp_ws.service=wootech_imob_api'
      - 'traefik.http.routers.fazendasbrasil_whatsapp_ws.rule=(Host(`fazendasbrasil.com`) || Host(`www.fazendasbrasil.com`)) && PathPrefix(`/api/whatsapp/ws`)'
      - 'traefik.http.routers.fazendasbrasil_whatsapp_ws.entrypoints=websecure'
      - 'traefik.http.routers.fazendasbrasil_whatsapp_ws.tls.certresolver=letsencryptresolver'
      - 'traefik.http.routers.fazendasbrasil_whatsapp_ws.priority=20'
      - 'traefik.http.routers.fazendasbrasil_whatsapp_ws.service=wootech_imob_api'
      - 'traefik.http.routers.wootech_imob_api.rule=(Host(`imob.wootech.com.br`) || Host(`imobfluow.consultio.com.br`) || Host(`okaimoveis.com.br`) || Host(`www.okaimoveis.com.br`)) && PathPrefix(`/api`)'
      - 'traefik.http.routers.wootech_imob_api.entrypoints=websecure'
      - 'traefik.http.routers.wootech_imob_api.tls.certresolver=letsencryptresolver'
      - 'traefik.http.routers.wootech_imob_api.priority=10'
      - 'traefik.http.routers.wootech_imob_api.service=wootech_imob_api'
      - 'traefik.http.routers.fazendasbrasil_api.rule=(Host(`fazendasbrasil.com`) || Host(`www.fazendasbrasil.com`)) && PathPrefix(`/api`)'
      - 'traefik.http.routers.fazendasbrasil_api.entrypoints=websecure'
      - 'traefik.http.routers.fazendasbrasil_api.tls.certresolver=letsencryptresolver'
      - 'traefik.http.routers.fazendasbrasil_api.priority=10'
      - 'traefik.http.routers.fazendasbrasil_api.service=wootech_imob_api'
      - 'traefik.http.services.wootech_imob_api.loadbalancer.server.port=3002'

  whatsapp-service:
    image: ghcr.io/fluowai/woomobzy-whatsapp:latest
    environment:
      NODE_ENV: production
      PORT: 3100
      ALLOWED_ORIGINS: 'https://imob.wootech.com.br,https://imobfluow.consultio.com.br,https://okaimoveis.com.br,https://www.okaimoveis.com.br,https://fazendasbrasil.com,https://www.fazendasbrasil.com,https://fazendasbrasil.com.br,https://www.fazendasbrasil.com.br'
      CORS_ORIGINS: 'https://imob.wootech.com.br,https://imobfluow.consultio.com.br,https://okaimoveis.com.br,https://www.okaimoveis.com.br,https://fazendasbrasil.com,https://www.fazendasbrasil.com,https://fazendasbrasil.com.br,https://www.fazendasbrasil.com.br'
      SUPABASE_URL: '${VITE_SUPABASE_URL}'
      SUPABASE_SERVICE_ROLE_KEY: '${SUPABASE_SERVICE_ROLE_KEY}'
      SUPABASE_JWT_SECRET: '${SUPABASE_JWT_SECRET}'
      SUPABASE_DB_URL: '${SUPABASE_DB_URL}'
      PGSSLMODE: require
      NODE_URL: 'http://api:3002'
      WHATSAPP_SERVICE_TOKEN: '${WHATSAPP_SERVICE_TOKEN}'
      WHATSAPP_INTERNAL_TOKEN: '${WHATSAPP_INTERNAL_TOKEN}'
      WHATSAPP_WS_JWT_SECRET: '${WHATSAPP_WS_JWT_SECRET}'
      WHATSAPP_AI_AUTOMATION: 'true'
      MEDIA_STORAGE_PROVIDER: 'minio'
      MINIO_ENDPOINT: '${MINIO_ENDPOINT}'
      MINIO_PUBLIC_URL: '${MINIO_PUBLIC_URL}'
      MINIO_ACCESS_KEY: '${MINIO_ACCESS_KEY}'
      MINIO_SECRET_KEY: '${MINIO_SECRET_KEY}'
      MINIO_REGION: '${MINIO_REGION}'
      MINIO_WHATSAPP_BUCKET: '${MINIO_WHATSAPP_BUCKET}'
    volumes:
      - whatsapp_sessions:/app/.sessions
    networks:
      - imobfluow_internal

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: 'imobzy'
      RABBITMQ_DEFAULT_PASS: '${RABBITMQ_DEFAULT_PASS}'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - imobfluow_internal
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  agro-intelligence:
    image: ghcr.io/fluowai/woomobzy-agro:latest
    networks:
      - imobfluow_internal

volumes:
  whatsapp_sessions:

  rabbitmq_data:
  imobzy_traefik_dynamic:
    external: true

networks:
  woopanel1:
    external: true
  imobfluow_internal:
    driver: bridge
