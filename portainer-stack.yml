version: '3.8'

services:
  frontend:
    image: ghcr.io/fluowai/woomobzy-frontend:latest
    environment:
      VITE_API_URL: 'same-origin'
      VITE_WHATSAPP_API_URL: '/api/whatsapp'
      VITE_WHATSAPP_WS_URL: '/api/whatsapp/ws'
      VITE_SUPABASE_URL: '${VITE_SUPABASE_URL}'
      VITE_SUPABASE_ANON_KEY: '${VITE_SUPABASE_ANON_KEY}'
      VITE_PANEL_URL: 'https://imob.wootech.com.br'
      VITE_PUBLIC_APP_URL: 'https://imob.wootech.com.br'
    networks:
      - woopanel1
      - imobfluow_internal
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=woopanel1'
      - 'traefik.http.routers.wootech_imob_frontend.rule=Host(`imob.wootech.com.br`) || Host(`imobfluow.consultio.com.br`) || Host(`okaimoveis.com.br`) || Host(`www.okaimoveis.com.br`)'
      - 'traefik.http.routers.wootech_imob_frontend.entrypoints=websecure'
      - 'traefik.http.routers.wootech_imob_frontend.tls.certresolver=letsencryptresolver'
      - 'traefik.http.routers.wootech_imob_frontend.priority=1'
      - 'traefik.http.routers.wootech_imob_frontend.service=wootech_imob_frontend'
      - 'traefik.http.routers.fazendasbrasil_frontend.rule=Host(`fazendasbrasil.com`) || Host(`www.fazendasbrasil.com`)'
      - 'traefik.http.routers.fazendasbrasil_frontend.entrypoints=websecure'
      - 'traefik.http.routers.fazendasbrasil_frontend.tls.certresolver=letsencryptresolver'
      - 'traefik.http.routers.fazendasbrasil_frontend.priority=2'
      - 'traefik.http.routers.fazendasbrasil_frontend.service=wootech_imob_frontend'
      - 'traefik.http.services.wootech_imob_frontend.loadbalancer.server.port=80'
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  api:
    image: ghcr.io/fluowai/woomobzy-api:latest
    environment:
      NODE_ENV: production
      PORT: 3002
      PLATFORM_IP: "207.58.153.219"
      WHATSAPP_PROVIDER: 'whatsmeow'
      WHATSAPP_WEBHOOK_URL: 'http://api:3002'
      ALLOWED_ORIGINS: 'https://imob.wootech.com.br,https://imobfluow.consultio.com.br,https://okaimoveis.com.br,https://www.okaimoveis.com.br,https://fazendasbrasil.com,https://www.fazendasbrasil.com,https://fazendasbrasil.com.br,https://www.fazendasbrasil.com.br'
      CORS_ORIGINS: 'https://imob.wootech.com.br,https://imobfluow.consultio.com.br,https://okaimoveis.com.br,https://www.okaimoveis.com.br,https://fazendasbrasil.com,https://www.fazendasbrasil.com,https://fazendasbrasil.com.br,https://www.fazendasbrasil.com.br'
      VITE_SUPABASE_URL: '${VITE_SUPABASE_URL}'
      VITE_SUPABASE_ANON_KEY: '${VITE_SUPABASE_ANON_KEY}'
      SUPABASE_SERVICE_ROLE_KEY: '${SUPABASE_SERVICE_ROLE_KEY}'
      SUPABASE_JWT_SECRET: '${SUPABASE_JWT_SECRET}'
      DATABASE_URL: '${DATABASE_URL}'
      SUPABASE_DB_URL: '${SUPABASE_DB_URL}'
      PGSSLMODE: require
      WHATSAPP_API_URL: 'http://whatsapp-service:3100'
      WHATSMEOW_URL: 'http://whatsapp-service:3100'
      NODE_URL: 'http://api:3002'
      AGRO_INTEL_URL: 'http://agro-intelligence:8000'
      INSTAGRAM_SERVICE_URL: 'http://instagram-service:3200'
      INSTAGRAM_INTERNAL_TOKEN: '${INSTAGRAM_INTERNAL_TOKEN}'
      DOCUMENT_WORKER_URL: 'http://document-worker:8001'
      DOCUMENT_WEBHOOK_SECRET: '${DOCUMENT_WEBHOOK_SECRET}'
      SIGNATURE_WEBHOOK_SECRET: '${SIGNATURE_WEBHOOK_SECRET}'
      EMAIL_ENCRYPTION_KEY: '${EMAIL_ENCRYPTION_KEY}'
      ASAAS_API_KEY: '${ASAAS_API_KEY:-}'
      ASAAS_ENVIRONMENT: '${ASAAS_ENVIRONMENT:-production}'
      ASAAS_WEBHOOK_TOKEN: '${ASAAS_WEBHOOK_TOKEN:-}'
      OPENAI_API_KEY: '${OPENAI_API_KEY:-}'
      ANTHROPIC_API_KEY: '${ANTHROPIC_API_KEY:-}'
      GEMINI_API_KEY: '${GEMINI_API_KEY:-}'
      GROQ_API_KEY: '${GROQ_API_KEY:-}'
      OPENROUTER_API_KEY: '${OPENROUTER_API_KEY:-}'
      WHATSAPP_SERVICE_TOKEN: '${WHATSAPP_SERVICE_TOKEN}'
      WHATSAPP_INTERNAL_TOKEN: '${WHATSAPP_INTERNAL_TOKEN}'
      WHATSAPP_WS_JWT_SECRET: '${WHATSAPP_WS_JWT_SECRET}'
      WHATSAPP_AI_AUTOMATION: 'true'
      REDIS_URL: 'redis://redis:6379'
      RABBITMQ_URL: '${RABBITMQ_URL}'
      MEDIA_STORAGE_PROVIDER: 'minio'
      MINIO_ENDPOINT: '${MINIO_ENDPOINT}'
      MINIO_PUBLIC_URL: '${MINIO_PUBLIC_URL}'
      MINIO_ACCESS_KEY: '${MINIO_ACCESS_KEY}'
      MINIO_SECRET_KEY: '${MINIO_SECRET_KEY}'
      MINIO_REGION: '${MINIO_REGION:-us-east-1}'
      MINIO_MEDIA_BUCKET: '${MINIO_MEDIA_BUCKET:-imobzy-media}'
      MINIO_DOCUMENTS_BUCKET: '${MINIO_DOCUMENTS_BUCKET:-imobzy-documents}'
      MINIO_WHATSAPP_BUCKET: '${MINIO_WHATSAPP_BUCKET:-whatsapp-media}'
      MINIO_EXPORTS_BUCKET: '${MINIO_EXPORTS_BUCKET:-imobzy-exports}'
      MINIO_BACKUPS_BUCKET: '${MINIO_BACKUPS_BUCKET:-imobzy-backups}'
      TRAEFIK_DYNAMIC_DIR: '/app/traefik/dynamic'
      TRAEFIK_FRONTEND_SERVICE: 'wootech_imob_frontend@docker'
      TRAEFIK_API_SERVICE: 'wootech_imob_api@docker'
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - imobzy_traefik_dynamic:/app/traefik/dynamic
    networks:
      - woopanel1
      - imobfluow_internal
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=woopanel1'
      - 'traefik.http.routers.wootech_imob_whatsapp_ws.rule=(Host(`imob.wootech.com.br`) || Host(`imobfluow.consultio.com.br`) || Host(`okaimoveis.com.br`) || Host(`www.okaimoveis.com.br`)) && PathPrefix(`/api/whatsapp/ws`)'
      - 'traefik.http.routers.wootech_imob_whatsapp_ws.entrypoints=websecure'
      - 'traefik.http.routers.wootech_imob_whatsapp_ws.tls.certresolver=letsencryptresolver'
      - 'traefik.http.routers.wootech_imob_whatsapp_ws.priority=20'
      - 'traefik.http.routers.wootech_imob_whatsapp_ws.service=wootech_imob_api'
      - 'traefik.http.routers.fazendasbrasil_whatsapp_ws.rule=(Host(`fazendasbrasil.com`) || Host(`www.fazendasbrasil.com`)) && PathPrefix(`/api/whatsapp/ws`)'
      - 'traefik.http.routers.fazendasbrasil_whatsapp_ws.entrypoints=websecure'
      - 'traefik.http.routers.fazendasbrasil_whatsapp_ws.tls.certresolver=letsencryptresolver'
      - 'traefik.http.routers.fazendasbrasil_whatsapp_ws.priority=20'
      - 'traefik.http.routers.fazendasbrasil_whatsapp_ws.service=wootech_imob_api'
      - 'traefik.http.routers.wootech_imob_api.rule=(Host(`imob.wootech.com.br`) || Host(`imobfluow.consultio.com.br`) || Host(`okaimoveis.com.br`) || Host(`www.okaimoveis.com.br`)) && PathPrefix(`/api`)'
      - 'traefik.http.routers.wootech_imob_api.entrypoints=websecure'
      - 'traefik.http.routers.wootech_imob_api.tls.certresolver=letsencryptresolver'
      - 'traefik.http.routers.wootech_imob_api.priority=10'
      - 'traefik.http.routers.wootech_imob_api.service=wootech_imob_api'
      - 'traefik.http.routers.fazendasbrasil_api.rule=(Host(`fazendasbrasil.com`) || Host(`www.fazendasbrasil.com`)) && PathPrefix(`/api`)'
      - 'traefik.http.routers.fazendasbrasil_api.entrypoints=websecure'
      - 'traefik.http.routers.fazendasbrasil_api.tls.certresolver=letsencryptresolver'
      - 'traefik.http.routers.fazendasbrasil_api.priority=10'
      - 'traefik.http.routers.fazendasbrasil_api.service=wootech_imob_api'
      - 'traefik.http.services.wootech_imob_api.loadbalancer.server.port=3002'
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3002/api/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.2'
          memory: 256M

  whatsapp-service:
    image: ghcr.io/fluowai/woomobzy-whatsapp:latest
    environment:
      NODE_ENV: production
      PORT: 3100
      ALLOWED_ORIGINS: 'https://imob.wootech.com.br,https://imobfluow.consultio.com.br,https://okaimoveis.com.br,https://www.okaimoveis.com.br,https://fazendasbrasil.com,https://www.fazendasbrasil.com,https://fazendasbrasil.com.br,https://www.fazendasbrasil.com.br'
      CORS_ORIGINS: 'https://imob.wootech.com.br,https://imobfluow.consultio.com.br,https://okaimoveis.com.br,https://www.okaimoveis.com.br,https://fazendasbrasil.com,https://www.fazendasbrasil.com,https://fazendasbrasil.com.br,https://www.fazendasbrasil.com.br'
      SUPABASE_URL: '${VITE_SUPABASE_URL}'
      SUPABASE_SERVICE_ROLE_KEY: '${SUPABASE_SERVICE_ROLE_KEY}'
      SUPABASE_JWT_SECRET: '${SUPABASE_JWT_SECRET}'
      SUPABASE_DB_URL: '${SUPABASE_DB_URL}'
      PGSSLMODE: require
      NODE_URL: 'http://api:3002'
      WHATSAPP_SERVICE_TOKEN: '${WHATSAPP_SERVICE_TOKEN}'
      WHATSAPP_INTERNAL_TOKEN: '${WHATSAPP_INTERNAL_TOKEN}'
      WHATSAPP_WS_JWT_SECRET: '${WHATSAPP_WS_JWT_SECRET}'
      WHATSAPP_AI_AUTOMATION: 'true'
      MEDIA_STORAGE_PROVIDER: 'minio'
      MINIO_ENDPOINT: '${MINIO_ENDPOINT}'
      MINIO_PUBLIC_URL: '${MINIO_PUBLIC_URL}'
      MINIO_ACCESS_KEY: '${MINIO_ACCESS_KEY}'
      MINIO_SECRET_KEY: '${MINIO_SECRET_KEY}'
      MINIO_REGION: '${MINIO_REGION}'
      MINIO_WHATSAPP_BUCKET: '${MINIO_WHATSAPP_BUCKET}'
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - whatsapp_sessions:/app/.sessions
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:3100/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - imobfluow_internal

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq-server
    environment:
      RABBITMQ_ERLANG_COOKIE: '${RABBITMQ_ERLANG_COOKIE}'
      RABBITMQ_DEFAULT_USER: '${RABBITMQ_DEFAULT_USER:-imobzy}'
      RABBITMQ_DEFAULT_PASS: '${RABBITMQ_DEFAULT_PASS}'
      RABBITMQ_NODENAME: 'rabbit@rabbitmq-server'
    volumes:
      - rabbitmq_data_v4:/var/lib/rabbitmq/mnesia
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'
    networks:
      - imobfluow_internal
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'
    networks:
      - imobfluow_internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 5s
      retries: 5

  instagram-service:
    image: ghcr.io/fluowai/woomobzy-instagram-service:latest
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'
    environment:
      NODE_ENV: production
      PORT: 3200
      ALLOWED_ORIGINS: 'https://imob.wootech.com.br,https://imobfluow.consultio.com.br,https://okaimoveis.com.br,https://www.okaimoveis.com.br,https://fazendasbrasil.com,https://www.fazendasbrasil.com'
      SUPABASE_URL: '${VITE_SUPABASE_URL}'
      SUPABASE_SERVICE_ROLE_KEY: '${SUPABASE_SERVICE_ROLE_KEY}'
      SUPABASE_JWT_SECRET: '${SUPABASE_JWT_SECRET}'
      REDIS_URL: 'redis://redis:6379'
      INSTAGRAM_WORKER_URL: 'http://instagram-worker:8000'
      INSTAGRAM_INTERNAL_TOKEN: '${INSTAGRAM_INTERNAL_TOKEN}'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - imobfluow_internal

  instagram-worker:
    image: ghcr.io/fluowai/woomobzy-instagram-worker:latest
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'
    environment:
      REDIS_URL: 'redis://redis:6379'
      NODE_SERVICE_URL: 'http://instagram-service:3200'
      INTERNAL_TOKEN: '${INSTAGRAM_INTERNAL_TOKEN}'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - imobfluow_internal

  document-worker:
    image: ghcr.io/fluowai/woomobzy-document-worker:latest
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'
    environment:
      GEMINI_API_KEY: '${GEMINI_API_KEY:-}'
      WEBHOOK_URL: 'http://api:3002/api/documents/webhook/worker-result'
      DOCUMENT_WEBHOOK_SECRET: '${DOCUMENT_WEBHOOK_SECRET}'
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8001/health")']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.2'
          memory: 256M
    networks:
      - imobfluow_internal

  agro-intelligence:
    image: ghcr.io/fluowai/woomobzy-agro:latest
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/")']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - imobfluow_internal

volumes:
  whatsapp_sessions:
  rabbitmq_data_v4:
  imobzy_traefik_dynamic:
    external: true

networks:
  woopanel1:
    external: true
  imobfluow_internal:
    driver: bridge
